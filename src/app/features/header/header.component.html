<header>
  <div class="wrap headbar">
    <div class="logo">
      <span class="mark">S</span>
      <span>STRIDE</span>
    </div>

    <nav>
      <a href="#">Trang chủ</a>
      <a href="#san-pham">Sản phẩm</a>
      <a href="#thong-tin">Về chúng tôi</a>
      <a href="#">Liên hệ</a>
    </nav>

    <div class="head-actions">
      <button type="button" class="cart-btn" (click)="openCart()">
        <svg class="icon-cart" viewBox="0 0 24 24">
          <path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6" />
          <circle cx="9" cy="20" r="1.2" fill="currentColor" stroke="none" />
          <circle cx="17" cy="20" r="1.2" fill="currentColor" stroke="none" />
        </svg>
        <span>Giỏ hàng</span>
        <span class="cart-count">{{ cartCount() }}</span>
      </button>
    </div>
  </div>
</header>
