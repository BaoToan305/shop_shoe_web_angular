<!-- Overlay: bấm ra ngoài để đóng -->
<div class="rp-overlay" [class.is-open]="isOpen" (click)="onClose()">

  <!-- Popup: chặn click lan ra overlay -->
  <div class="rp-modal" role="dialog" aria-modal="true" aria-labelledby="rp-title" (click)="$event.stopPropagation()">

    <button type="button" class="rp-close" aria-label="Đóng" (click)="onClose()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>

    <div class="rp-logo">s</div>

    <h2 class="rp-title" id="rp-title">Tạo tài khoản mới</h2>
    <p class="rp-desc">
      Đăng ký để lưu size chân, theo dõi đơn hàng và nhận ưu tiên mở bán các mẫu giày giới hạn.
    </p>

    <form class="rp-form" novalidate (submit)="$event.preventDefault();">

      <!-- Email -->
      <label class="rp-label" for="rp-email">Email</label>
      <div class="rp-field" [class.rp-invalid]="invalidFields.email">
        <svg class="rp-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M3 7l9 6 9-6" />
        </svg>
        <input id="rp-email" name="email" type="email" placeholder="Nhập email" autocomplete="email"
          [(ngModel)]="email" (focus)="clearFieldError('email')" required maxlength="150" />
      </div>

      <!-- Tên tài khoản -->
      <label class="rp-label" for="rp-username">Tên tài khoản</label>
      <div class="rp-field" [class.rp-invalid]="invalidFields.username">
        <svg class="rp-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
        </svg>
        <input id="rp-username" name="username" type="text" placeholder="Nhập tên tài khoản" autocomplete="username"
          [(ngModel)]="username" (focus)="clearFieldError('username')" minlength="3" maxlength="255" pattern="[A-Za-z0-9._-]+"
          title="Tên tài khoản chỉ gồm chữ không dấu, số, dấu chấm, gạch dưới hoặc gạch ngang" required />
      </div>

      <!-- Mật khẩu -->
      <label class="rp-label" for="rp-password">Mật khẩu</label>
      <div class="rp-field" [class.rp-invalid]="invalidFields.password">
        <svg class="rp-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="10" rx="2" />
          <path d="M8 11V8a4 4 0 018 0v3" />
        </svg>
        <input #pwd id="rp-password" name="password" type="password" placeholder="Nhập mật khẩu" autocomplete="new-password"
          [(ngModel)]="password" (focus)="clearFieldError('password')" minlength="8" maxlength="255" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).+"
          title="Mật khẩu cần ít nhất 8 ký tự, gồm chữ hoa, chữ thường và số" required />
        <button type="button" class="rp-toggle" (click)="pwd.type = pwd.type === 'password' ? 'text' : 'password'">
          {{ pwd.type === 'password' ? 'Hiện' : 'Ẩn' }}
        </button>
      </div>

      <!-- Xác nhận mật khẩu -->
      <label class="rp-label" for="rp-confirm-password">Xác nhận mật khẩu</label>
      <div class="rp-field" [class.rp-invalid]="invalidFields.confirmPassword">
        <svg class="rp-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="10" rx="2" />
          <path d="M8 11V8a4 4 0 018 0v3" />
        </svg>
        <input #confirmPwd id="rp-confirm-password" name="confirmPassword" type="password" placeholder="Xác nhận lại mật khẩu" autocomplete="new-password"
          [(ngModel)]="confirmPassword" (focus)="clearFieldError('confirmPassword')" minlength="8" maxlength="255" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).+"
          title="Mật khẩu cần ít nhất 8 ký tự, gồm chữ hoa, chữ thường và số" required />
        <button type="button" class="rp-toggle" (click)="confirmPwd.type = confirmPwd.type === 'password' ? 'text' : 'password'">
          {{ confirmPwd.type === 'password' ? 'Hiện' : 'Ẩn' }}
        </button>
      </div>

      <!-- Họ và tên -->
      <label class="rp-label" for="rp-fullname">Họ và tên</label>
      <div class="rp-field" [class.rp-invalid]="invalidFields.fullName">
        <svg class="rp-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
        </svg>
        <input id="rp-fullname" name="fullName" type="text" placeholder="Nhập họ và tên" autocomplete="name"
          [(ngModel)]="fullName" (focus)="clearFieldError('fullName')" minlength="2" maxlength="100" pattern="[A-Za-zÀ-ỹĐđ ]+"
          title="Họ tên chỉ được chứa chữ cái và khoảng trắng" required />
      </div>

      <!-- Số điện thoại -->
      <label class="rp-label" for="rp-phone">Số điện thoại</label>
      <div class="rp-field" [class.rp-invalid]="invalidFields.phoneNumber">
        <svg class="rp-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z" />
        </svg>
        <input id="rp-phone" name="phoneNumber" type="tel" placeholder="Nhập số điện thoại" autocomplete="tel"
           [(ngModel)]="phoneNumber" (focus)="clearFieldError('phoneNumber')" minlength="10" maxlength="11" inputmode="numeric"
          pattern="0[0-9]{9,10}" title="Số điện thoại phải bắt đầu bằng 0 và có 10 hoặc 11 chữ số" required />
      </div>

      <!-- Nút -->
      <div class="rp-actions">
        <button type="button" class="rp-btn rp-btn-ghost" (click)="onClose()">Đóng</button>
        <button type="submit" class="rp-btn rp-btn-primary" (click)="OnCreate()"><span>Xác nhận</span></button>
      </div>
    </form>

    <p class="rp-secure">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="11" width="14" height="10" rx="2" />
        <path d="M8 11V8a4 4 0 018 0v3" />
      </svg>
      Thông tin của bạn được mã hóa và bảo mật
    </p>
  </div>
</div>
